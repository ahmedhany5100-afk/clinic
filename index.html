<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>عيادتي | د. محمود شعبان ود. زينب بيومي</title>
<meta name="theme-color" content="#1d4ed8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="عيادتي">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f8ff;--c:#fff;--p:#1d4ed8;--p2:#e3ecff;--tx:#14213d;--m:#5f6b85;--b:#d9e2f5;--r:#b42318;--g:#047857;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1220;--c:#141d33;--p:#6e9bff;--p2:#1c2a4d;--tx:#e8eeff;--m:#9aa8c9;--b:#27355c;--r:#f87171;--g:#34d399}}
:root[data-theme=dark]{--bg:#0c1220;--c:#141d33;--p:#6e9bff;--p2:#1c2a4d;--tx:#e8eeff;--m:#9aa8c9;--b:#27355c;--r:#f87171;--g:#34d399}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.6}
#app{max-width:560px;margin:auto;padding:12px 12px 140px}h1{font-size:21px;margin:6px 0 10px}h2{font-size:17px;margin:0}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.m{color:var(--m);font-size:14px}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:inherit;min-height:46px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#0b1226}}
:root[data-theme=dark] .btn{color:#0b1226}
.btn.g{background:var(--p2);color:var(--tx)}.btn.s{min-height:38px;padding:4px 12px;font-size:15px}.btn.d{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--tx);min-height:46px}
label{display:block;font-size:14px;margin:10px 0 2px;color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:0;border:0;font:inherit;font-size:13px;color:var(--m);min-height:52px}nav button.on{color:var(--p);font-weight:700}nav i{display:block;font-style:normal;font-size:21px}
.fab{position:fixed;left:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 3px 10px #0004}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.err{color:var(--r);font-size:14px;min-height:20px}.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}
.w{display:flex;gap:8px;text-align:center}.w div{flex:1;background:var(--p2);border-radius:12px;padding:8px}.w b{display:block;font-size:20px;color:var(--p)}
.bd{border-radius:99px;padding:1px 10px;font-size:13px;background:#fef3c7;color:#92400e}.bd.ok{background:#d1fae5;color:#065f46}
.e{text-align:center;color:var(--m);padding:22px}#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:8px 16px;border-radius:99px;z-index:20;display:none}
table{width:100%;min-width:660px;border-collapse:collapse}th,td{padding:3px;font-size:14px;text-align:right}td input{min-height:40px;padding:6px;font-size:15px}td input[type=date]{width:140px}td input[type=number]{width:80px}td:nth-child(3){white-space:nowrap}textarea[data-n]{min-height:160px}.btn.g{color:var(--tx)}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.g{color:var(--tx)}}:root[data-theme=dark] .btn.g{color:var(--tx)}
.vr{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px;margin-bottom:10px}.v2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.v2 input{min-height:44px;padding:6px 8px;font-size:15px;min-width:0}.nm{background:var(--p);color:#fff;border-radius:99px;min-width:30px;height:30px;display:grid;place-items:center;font-size:15px}
.app-header{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--c);border:1px solid var(--b);border-radius:16px;margin-bottom:12px}.app-logo{width:46px;height:46px;border-radius:12px}.app-title{font-size:15px;font-weight:700;line-height:1.4}.app-sub{font-size:12px;color:var(--m)}.btn.rec{background:#dc2626!important;color:#fff!important}</style></head><body><div id="app"></div><div id="m"></div><div id="t"></div><nav id="nav"></nav>
<script>
const K='clinic_simple_v2',td=()=>new Date().toISOString().slice(0,10),ad=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},uid=()=>Math.random().toString(36).slice(2,8);
const MSG='السلام عليكم 🌿\nتذكير بميعاد المتابعة {التاريخ}.\nعيادات د. محمود شعبان ود. زينب بيومي للتغذية العلاجية.';
const seed=()=>({msg:MSG,pts:[{id:'P-001',name:'منى السيد (مثال)',phone:'01012345671',notes:''},{id:'P-002',name:'كريم عادل (مثال)',phone:'01012345672',notes:''}],
vis:[{id:'a1',pid:'P-001',date:ad(-30),w:82,note:'أول زيارة',next:ad(-2)},{id:'a2',pid:'P-001',date:ad(-14),w:80,note:'',next:ad(0)},{id:'a3',pid:'P-002',date:ad(-5),w:96,note:'',next:ad(4)}],
trt:[{id:'t1',pid:'P-001',date:ad(-14),name:'نظام تجريبي',dose:'كما كتبه الدكتور',ins:'بعد الأكل'}],pays:[{id:'y1',pid:'P-001',date:ad(-14),amt:300,paid:1},{id:'y2',pid:'P-002',date:ad(-5),amt:300,paid:0}]});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}if(!D)D=seed();if(D.msg&&(D.msg.indexOf('نذكرك بميعاد الدكتور')>-1||D.msg.indexOf('تذكير بميعاد الكشف')>-1))D.msg=MSG;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
let V='pts',PID=null,Q='';const $=s=>document.querySelector(s),P=i=>D.pts.find(p=>p.id===i)||{name:'—',phone:''};
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('ar-EG',{day:'numeric',month:'short'}):'—',n=x=>Number(x).toLocaleString('ar-EG');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=s=>{const t=$('#t');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1700)};
function cp(t){try{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'),fb)}catch(e){fb()}function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ')}catch(e){toast('انسخ يدويًا')}a.remove()}}
const vs=pid=>D.vis.filter(v=>v.pid===pid).sort((a,b)=>a.date.localeCompare(b.date));
const msg=(p,d)=>(D.msg||MSG).replace('{التاريخ}',d?(d===td()?'اليوم':'يوم '+fd(d)):'').replace(/\s+([.،])/g,'$1');
const wa=(p,d)=>`https://wa.me/2${p.phone}?text=${encodeURIComponent(msg(p,d))}`;
let CT='today';const calls=()=>D.pts.filter(p=>p.appt&&!p.done&&(CT==='today'?p.appt<=td():p.appt===ad(1))).sort((a,b)=>a.appt.localeCompare(b.appt));
const empty=t=>`<div class="e">${t}</div>`,tl=(c,i)=>`<button class="btn s g" data-a="edit|${c}|${i}">تعديل</button> <button class="btn s d" data-a="del|${c}|${i}">حذف</button>`;
const df=x=>(x>0?'+':'')+n(+x.toFixed(1)),dd=(a,i)=>i&&a[i].w!==''&&a[i-1].w!==''?df(a[i].w-a[i-1].w):'—';
function sm(pid){const p=P(pid),w=vs(pid).filter(x=>x.w!==''),f=w[0],l=w[w.length-1],nx=p.appt?{next:p.appt}:null;
return(f?`<div class="w"><div><b>${n(f.w)}</b>أول وزن</div><div><b>${n(l.w)}</b>الوزن الآن</div><div><b>${df(l.w-f.w)}</b>الفرق</div></div>`:'')+(nx?`<div class="card rw" style="margin-top:10px"><span>الميعاد الجاي: <b>${fd(nx.next)}</b></span><a class="btn s" data-a="wa|${p.id}|${nx.next}" target="_blank" rel="noopener" href="${wa(p,nx.next)}">واتساب</a></div>`:'')}
function upd(pid){$('#sum').innerHTML=sm(pid);const v=vs(pid);v.forEach((x,i)=>{const c=$(`[data-d="${x.id}"]`);if(c)c.textContent=dd(v,i)})}
const tn=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,،]/g,'.').trim(),nxd=pid=>P(pid).appt||'';
const NAV=[['pts','👥','المرضى'],['call','📅','مواعيد اليوم'],['pay','💰','الفلوس'],['more','➕','إضافات']];
const hd=()=>`<div class="app-header"><img class="app-logo" src="icon-192.png" alt=""><div><div class="app-title">عيادات د. محمود شعبان ود. زينب أحمد بيومي</div><div class="app-sub">التغذية العلاجية وعلاج السمنة والنحافة</div></div></div>`;
let rc=null,rn=false;
function voice(pid){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,ta=$('textarea[data-n="'+pid+'"]');if(!SR){toast('الإملاء بيشتغل على كروم');return}
if(rn){rc&&rc.stop();return}
const end=()=>{rn=false;const b=$('#vb');if(b){b.classList.remove('rec');b.textContent='🎙️ تحدث بدل الكتابة'}};
rc=new SR();rc.lang='ar-EG';rc.continuous=true;rc.interimResults=false;
rc.onstart=()=>{rn=true;const b=$('#vb');if(b){b.classList.add('rec');b.textContent='⏹️ دوس للإنهاء'}};
rc.onresult=e=>{const t=e.results[e.results.length-1][0].transcript;ta.value=(ta.value?ta.value+' ':'')+t;P(pid).doc=ta.value;save()};
rc.onerror=end;rc.onend=end;try{rc.start()}catch(e){end()}}
const views={
pts(){return`${hd()}<h1>المرضى</h1><input id="q" placeholder="ابحث بالاسم أو الرقم" value="${esc(Q)}"><div id="pl" style="margin-top:10px">${pl()}</div><button class="btn fab" data-a="add|pts">+</button>`},
prof(){const p=P(PID),v=vs(PID);
return`<button class="btn s g" data-a="nav|pts">→ رجوع</button>
<div class="card" style="margin-top:8px"><div class="rw"><h1 style="margin:0">${esc(p.name)}</h1><span class="bd ok">ملف ${p.id}</span></div><div class="rw" style="margin-top:6px"><span>📞 ${esc(p.phone)}</span><span>${tl('pts',p.id)}</span></div><div class="row"><a class="btn" data-a="tel|${p.id}" target="_blank" rel="noopener" href="tel:${p.phone}">📞 اتصال</a><a class="btn g" data-a="wa|${p.id}|${nxd(p.id)}" target="_blank" rel="noopener" href="${wa(p)}">واتساب</a></div></div>
<div class="card"><b>الميعاد الجاي</b><input type="date" data-ap="${p.id}" value="${p.appt||''}" style="margin-top:6px"></div><div id="sum">${sm(PID)}</div>
<div class="rw" style="margin:14px 0 8px"><h2>الزيارات</h2><button class="btn s" data-a="addv|${p.id}">+ إضافة زيارة</button></div>
${v.map((x,i)=>`<div class="vr"><div class="rw"><span class="nm">${i+1}</span><span>الفرق: <b data-d="${x.id}">${dd(v,i)}</b></span><button class="btn s d" data-a="del|vis|${x.id}">✕</button></div><div class="v2"><div><div class="m">التاريخ</div><input type="date" data-f="${x.id}|date" value="${x.date}"></div><div><div class="m">الوزن (كجم)</div><input inputmode="decimal" data-f="${x.id}|w" value="${x.w}"></div></div><div class="v2" style="grid-template-columns:1fr"><div><div class="m">ملاحظة</div><input data-f="${x.id}|note" value="${esc(x.note)}"></div></div><div class="v2" style="grid-template-columns:1fr 1fr 1fr"><div><div class="m">الدهون %</div><input inputmode="decimal" data-f="${x.id}|fat" value="${x.fat??''}"></div><div><div class="m">العضلات %</div><input inputmode="decimal" data-f="${x.id}|mus" value="${x.mus??''}"></div><div><div class="m">المياه %</div><input inputmode="decimal" data-f="${x.id}|wat" value="${x.wat??''}"></div></div></div>`).join('')}${v.length?'':empty('دوس إضافة زيارة')}
<div class="rw" style="margin:14px 0 8px"><h2>العلاج</h2><button class="btn s" data-a="add|trt|${p.id}">+ علاج</button></div>
${D.trt.filter(x=>x.pid===PID).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="card"><div class="rw"><b>${esc(x.name)}</b><span class="m">${fd(x.date)}</span></div><div>الكمية: ${esc(x.dose)}</div><div class="m">${esc(x.ins)}</div>${tl('trt',x.id)}</div>`).join('')||empty('لا يوجد علاج')}
<div class="rw" style="margin:14px 0 8px"><h2>كتابة الدكتور</h2><button class="btn s g" id="vb" data-a="voice|${p.id}">🎙️ تحدث بدل الكتابة</button></div><textarea data-n="${p.id}" rows="8" placeholder="اكتب هنا أي ملاحظات...">${esc(p.doc||'')}</textarea><div class="m">بتتحفظ لوحدها. الإملاء الصوتي محتاج إنترنت.</div>`},
call(){const l=calls();return`${hd()}<h1>مواعيد اليوم</h1><div class="row" style="margin:0 0 10px"><button class="btn ${CT==='today'?'':'g'}" data-a="ct|today">النهاردة</button><button class="btn ${CT==='tom'?'':'g'}" data-a="ct|tom">بكرة</button></div>${l.map(p=>`<div class="card"><div class="rw"><b>${esc(p.name)}</b>${p.rem?'<span class="bd ok">✅ تم التذكير</span>':''}</div><label>الميعاد (غيّره من هنا لو حبيت)</label><input type="date" data-ap="${p.id}" value="${p.appt}"><div class="row"><a class="btn s" data-a="wa|${p.id}|${p.appt}" target="_blank" rel="noopener" href="${wa(p,p.appt)}">💬 تذكير</a><a class="btn s g" data-a="tel|${p.id}" target="_blank" rel="noopener" href="tel:${p.phone}">📞 اتصال</a><button class="btn s g" data-a="done|${p.id}">تم</button></div></div>`).join('')||empty('مفيش مواعيد 👍')}<div class="m">أي ميعاد بتحطه لمريض بيظهر هنا لوحده يوم الميعاد، ومعاد بكرة بيظهر في تبويب بكرة.</div>`},
pay(){const ok=D.pays.filter(y=>y.paid).reduce((s,y)=>s+ +y.amt,0),w=D.pays.filter(y=>!y.paid).reduce((s,y)=>s+ +y.amt,0);
return`${hd()}<h1>الفلوس</h1><div class="w"><div><b>${n(ok)}</b>اتدفع</div><div><b>${n(w)}</b>لسه</div></div><div style="margin-top:12px">${[...D.pays].sort((a,b)=>b.date.localeCompare(a.date)).map(y=>`<div class="card"><div class="rw"><b>${esc(P(y.pid).name)}</b><span class="bd ${y.paid?'ok':''}">${y.paid?'اتدفع':'لسه'}</span></div><div class="m">${n(y.amt)} ج.م • ${fd(y.date)}</div><div style="margin-top:6px">${y.paid?'':`<button class="btn s" data-a="paid|${y.id}">تم الدفع</button> `}${tl('pays',y.id)}</div></div>`).join('')||empty('لا توجد مدفوعات')}</div><button class="btn fab" data-a="add|pays">+</button>`},
more(){return`${hd()}<h1>إضافات</h1><div class="card"><b>تثبيت التطبيق</b><div class="m">من كروم: النقط التلات ⋮ ثم "Add to Home screen". بعد أول فتح بالنت بيشتغل بدون نت كمان.</div></div><div class="card"><b>رسالة التذكير</b><div class="m">اكتبها زي ما تحب. اكتب {التاريخ} مكان التاريخ</div><textarea id="mt" rows="3">${esc(D.msg||MSG)}</textarea><div class="row"><button class="btn" data-a="smsg">حفظ الرسالة</button></div><div class="m" style="margin-top:6px">زرار التذكير بيفتح الواتساب والرسالة جاهزة. ادوس إرسال بس.</div></div>
<div class="card"><b>نسخة احتياطية</b><div class="row"><button class="btn g" data-a="bk">انسخ بياناتي</button></div><label>استرجاع: الصق النسخة هنا</label><textarea id="rs" rows="2"></textarea><div class="row"><button class="btn g" data-a="rs">استرجاع</button></div></div>
<div class="card"><b>نسخة تجريبية</b><p class="m">البيانات بتتحفظ على الموبايل ده بس. دوس "انسخ بياناتي" مرة في الأسبوع واحتفظ بالنسخة.</p><button class="btn d" data-a="reset">مسح الأمثلة وبداية جديدة</button></div>`}};
function pl(){const q=Q.trim().toLowerCase();const l=D.pts.filter(p=>!q||p.name.toLowerCase().includes(q)||p.phone.includes(q)||p.id.toLowerCase().includes(q));
return l.map(p=>{const w=vs(p.id).filter(x=>x.w!=='').pop();return`<div class="card rw" data-a="open|${p.id}"><b>${esc(p.name)}</b><span class="bd ok">ملف ${p.id}</span></div>`}).join('')||empty('مفيش مرضى. دوس + وضيف أول مريض')}
function render(k){$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button data-a="nav|${k}" class="${V===k||(V==='prof'&&k==='pts')?'on':''}"><i>${i}</i>${l}</button>`).join('');$('#app').innerHTML=views[V]();if(!k)window.scrollTo(0,0)}
function defs(c,pid){const ps=[['','اختر المريض'],...D.pts.map(p=>[p.id,p.name])],pf={k:'pid',l:'المريض',t:'select',o:ps,req:1,v:pid};return{
pts:[{k:'name',l:'اسم المريض',req:1},{k:'phone',l:'رقم التليفون',req:1,re:/^01\d{9}$/,msg:'رقم التليفون 11 رقم ويبدأ بـ 01'}],
vis:[pf,{k:'date',l:'تاريخ الزيارة',t:'date',req:1,v:td()},{k:'w',l:'الوزن (كجم)',t:'number',req:1,min:20},{k:'fat',l:'الدهون %',t:'number',min:0},{k:'mus',l:'العضلات %',t:'number',min:0},{k:'wat',l:'المياه %',t:'number',min:0},{k:'note',l:'ملاحظة',t:'textarea'},{k:'next',l:'الميعاد الجاي',t:'date'}],
trt:[pf,{k:'date',l:'التاريخ',t:'date',req:1,v:td()},{k:'name',l:'اسم العلاج',req:1},{k:'dose',l:'الكمية (من الدكتور)',req:1},{k:'ins',l:'التعليمات'}],
pays:[pf,{k:'date',l:'التاريخ',t:'date',req:1,v:td()},{k:'amt',l:'المبلغ (ج.م)',t:'number',req:1,min:1},{k:'paid',l:'الحالة',t:'select',o:[['0','لسه'],['1','اتدفع']],v:'0'}]}[c]}
const fld=(f,v)=>`<label>${f.l}${f.req?' *':''}</label>`+(f.t==='select'?`<select name="f_${f.k}">${f.o.map(([a,b])=>`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`).join('')}</select>`:f.t==='textarea'?`<textarea name="f_${f.k}" rows="3">${esc(v)}</textarea>`:`<input name="f_${f.k}" type="${f.t==='number'?'text':f.t||'text'}" ${f.t==='number'?'inputmode="decimal"':''} value="${esc(v)}">`);
function form(c,rec,pid){const Fs=defs(c,pid||(rec&&rec.pid));
$('#m').innerHTML=`<div class="ov"><form class="sh" id="f" novalidate><h2 style="margin-bottom:6px">${rec?'تعديل':'إضافة'}</h2>${Fs.map(f=>fld(f,rec?(f.k==='paid'?(rec.paid?'1':'0'):rec[f.k]??''):f.v??'')).join('')}<div class="err" id="err"></div><div class="row"><button class="btn">حفظ</button><button type="button" class="btn g" data-a="x">إلغاء</button></div></form></div>`;
const er=s=>{$('#err').textContent=s};
$('#f').onsubmit=e=>{e.preventDefault();const o={};for(const f of Fs){let x=e.target.elements['f_'+f.k].value.trim();if(f.req&&!x)return er('اكتب: '+f.l);if(f.t==='number'&&x!==''){x=+tn(x);if(isNaN(x)||x<(f.min??-1e9))return er('قيمة غير صحيحة: '+f.l)}if(f.re&&x&&!f.re.test(x))return er(f.msg);o[f.k]=x}
if(c==='pays')o.paid=+o.paid;if(c==='vis'){o.done=false;if(o.next){const pp=P(o.pid);pp.appt=o.next;pp.done=false;pp.rem=false}}
if(rec)Object.assign(rec,o);else D[c].push({id:c==='pts'?'P-'+String(Math.max(0,...D.pts.map(q=>+q.id.slice(2)||0))+1).padStart(3,'0'):uid(),...o});
save();$('#m').innerHTML='';render();toast('تم الحفظ')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const[a,x,y]=b.dataset.a.split('|'),f=(c,i)=>D[c].find(r=>r.id===i);
if(a==='nav'){V=x;PID=null;Q='';render()}else if(a==='open'){PID=x;V='prof';render()}else if(a==='x')$('#m').innerHTML='';
else if(a==='add')form(x,null,y);else if(a==='edit')form(x,f(x,y));
else if(a==='del'){if(confirm(x==='pts'?'حذف المريض وكل سجلاته؟':'حذف السجل؟')){if(x==='pts'){['vis','trt','pays'].forEach(c=>D[c]=D[c].filter(r=>r.pid!==y));PID=null;V='pts'}D[x]=D[x].filter(r=>r.id!==y);save();render(x==='vis')}}
else if(a==='addv'){const id=uid();D.vis.push({id,pid:x,date:td(),w:'',fat:'',mus:'',wat:'',note:'',next:'',done:false});save();render(1);const i=$(`[data-f="${id}|w"]`);if(i)i.focus()}
else if(a==='wa'){const q=P(x);if(q.appt===y){q.rem=true;save()}setTimeout(()=>render(1),400)}else if(a==='voice'){voice(x)}else if(a==='ct'){CT=x;render()}
else if(a==='tel'){cp(P(x).phone)}
else if(a==='done'){P(x).done=true;save();render()}
else if(a==='paid'){if(confirm('تأكدت إن الفلوس وصلت؟')){f('pays',x).paid=1;save();render()}}
else if(a==='smsg'){const t=$('#mt').value.trim();if(!t)return toast('اكتب الرسالة');D.msg=t;save();toast('تم الحفظ')}
else if(a==='bk')cp(JSON.stringify(D));
else if(a==='rs'){try{const d=JSON.parse($('#rs').value);if(!d.pts)throw 0;D=d;save();render();toast('تم الاسترجاع')}catch(er){toast('النسخة مش صحيحة')}}
else if(a==='reset'){if(confirm('هيتمسح كل شيء. متأكد؟')){D={msg:MSG,pts:[],vis:[],trt:[],pays:[]};save();render()}}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){Q=t.value;$('#pl').innerHTML=pl()}else if(t.dataset.n){P(t.dataset.n).doc=t.value;save()}});
document.addEventListener('input',e=>{const d=e.target.dataset;if(!d.f)return;const[id,k]=d.f.split('|'),r=D.vis.find(q=>q.id===id);let x=e.target.value;if(k==='w'||k==='fat'||k==='mus'||k==='wat'){x=tn(x);x=x===''||isNaN(+x)?'':+x}r[k]=x;save();upd(r.pid)});
document.addEventListener('change',e=>{const id=e.target.dataset.ap;if(!id)return;const q=P(id);q.appt=e.target.value;q.done=false;q.rem=false;save();toast('تم تغيير الميعاد');if(V==='call')render(1);else upd(id)});
D.pts.forEach(q=>{if(q.appt===undefined){const v=D.vis.filter(x=>x.pid===q.id&&x.next).sort((a,b)=>a.date.localeCompare(b.date)).pop();q.appt=v?v.next:'';q.done=v?!!v.done:false;q.rem=false}});save();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
